name: quadrangis

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: qgis-postgres
    environment:
      POSTGRES_USER: quadran
      POSTGRES_PASSWORD: quadran
      POSTGRES_DB: quadrangis
    command: >
      postgres -c shared_preload_libraries=timescaledb
               -c max_connections=200
               -c shared_buffers=1GB
               -c work_mem=64MB
               -c maintenance_work_mem=512MB
               -c effective_cache_size=3GB
               -c random_page_cost=1.1
               -c max_parallel_workers_per_gather=2
    # query paralel pada tabel jutaan baris memakai shared memory (/dev/shm)
    shm_size: 1gb
    volumes:
      - pgdata:/home/postgres/pgdata/data
    ports:
      # 5434 di host agar tidak bentrok dengan PostgreSQL yang mungkin terpasang lokal
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadran -d quadrangis"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: qgis-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    ports:
      # 6380 di host agar tidak bentrok dengan Redis lain
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: qgis-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29093,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      # batasi heap JVM agar hemat memori di mesin pengembangan
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms256m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      # listener untuk klien di host (dev lokal)
      - "29093:29093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  backend:
    build: ./backend
    container_name: qgis-backend
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://quadran:quadran@postgres:5432/quadrangis?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      # batas lunak heap Go: GC bekerja lebih awal agar graf jutaan node tidak menggelembung
      GOMEMLIMIT: ${BACKEND_GOMEMLIMIT:-1200MiB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ""
        NEXT_PUBLIC_WS_URL: ""
    container_name: qgis-frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: qgis-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kafkadata:
